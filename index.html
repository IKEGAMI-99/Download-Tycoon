<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050807" />
  <meta name="description" content="A terminal-style incremental download tycoon game." />
  <title>Download Tycoon</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="terminal" id="terminal">
    <header class="topbar">
      <div class="brand">DOWNLOAD TYCOON <span class="dim">v0.1</span></div>
      <div class="status"><span class="dot"></span> ONLINE</div>
    </header>

    <section class="screen">
      <div class="ascii-map" id="asciiMap" aria-hidden="true"></div>

      <section class="panel transfer-panel">
        <div class="line"><span>FILE</span><b id="fileName">cat_photo.zip</b></div>
        <div class="line"><span>SIZE</span><b id="fileSize">12.00 MB</b></div>
        <div class="progress-wrap">
          <div class="progress-label"><span id="progressText">0.00%</span><span id="progressAmount">0 B / 12.00 MB</span></div>
          <div class="progress" id="progressBar">[........................................]</div>
        </div>
        <div class="stats-grid">
          <div><span>SPEED</span><b id="speed">0 B/s</b></div>
          <div><span>CLICK</span><b id="clickPower">64.00 KB</b></div>
          <div><span>TOTAL</span><b id="totalData">0 B</b></div>
          <div><span>PACKETS</span><b id="packets">0</b></div>
        </div>
      </section>

      <button class="ascii-button primary" id="downloadBtn" type="button">
        <span>+----------------------------------+</span>
        <span>|          [ DOWNLOAD ]            |</span>
        <span>+----------------------------------+</span>
      </button>

      <section class="layout">
        <section class="panel upgrades">
          <div class="panel-title">:: HARDWARE / AUTOMATION ::</div>
          <div id="upgradeList"></div>
        </section>

        <section class="panel log-panel">
          <div class="panel-title">:: SYSTEM LOG ::</div>
          <div class="logs" id="logs" aria-live="polite"></div>
        </section>
      </section>
    </section>

    <footer>
      <span id="saveState">AUTO-SAVE ENABLED</span>
      <button id="resetBtn" class="text-button" type="button">[ RESET SAVE ]</button>
    </footer>
  </main>

  <div class="float-layer" id="floatLayer" aria-hidden="true"></div>
  <script src="game.js"></script>
</body>
</html>
